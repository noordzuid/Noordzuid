<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noordzuid animatie tool</title>
    <link rel="stylesheet" href="style.css" />
    <script src="libraries/p5.min.js"></script>
  </head>

  <body>
    <main class="tool">
      <aside class="panel">
        <section class="section">
          <h1>Schets</h1>

          <div class="control">
            <label for="mode">Modus</label>
            <select id="mode">
              <option value="logo" selected>Logo</option>
              <option value="pattern">Patroon</option>
              <option value="noise">Noise veld</option>
            </select>
          </div>

          <div id="mode-settings" class="mode-settings">
          <div id="pattern-controls" class="mode-controls" hidden>
            <div id="pattern" class="option-buttons" role="group" aria-label="Patroon">
              <button data-value="empty">Leeg</button>
              <button data-value="alternating">Om en om</button>
              <button data-value="line">Lijn</button>
              <button data-value="lines">Lijnen</button>
              <button data-value="cross">Kruis</button>
              <button data-value="diagonal">X</button>
              <button data-value="ring">Ringen</button>
            </div>
          </div>

          <div id="noise-controls" class="mode-controls" hidden>
            <div id="noise-motion" class="option-buttons" role="group" aria-label="Noise beweging">
              <button data-value="calm">Rustig</button>
              <button data-value="playful">Normaal</button>
              <button data-value="wild">Snel</button>
            </div>

            <div id="noise-density" class="option-buttons" role="group" aria-label="Noise vulling">
              <button data-value="airy">Luchtig</button>
              <button data-value="balanced">Gemiddeld</button>
              <button data-value="full">Vol</button>
            </div>

          </div>

          <div id="logo-controls" class="mode-controls">
            <div id="logo-layout" class="option-buttons" role="group" aria-label="Logo opstelling">
              <button data-value="horizontal">Naast elkaar</button>
              <button data-value="vertical">Boven elkaar</button>
              <button data-value="single">Enkel</button>
            </div>
          </div>

          </div>

          <div class="control">
            <label for="grid-size">Zoom</label>
            <input id="grid-size" type="range" min="0" max="32" value="0" step="1" />
          </div>

          <div class="control">
            <label for="focus-logo">Focus op logo</label>
            <input id="focus-logo" type="checkbox" />
          </div>

          <div class="control">
            <label for="show-grid">Grid lijnen</label>
            <input id="show-grid" type="checkbox" />
          </div>

          <div class="control">
            <label for="logo-variant">Logo stijl</label>
            <select id="logo-variant"></select>
          </div>

          <div id="text-controls" class="control" hidden>
            <label for="logo-text">Tekst</label>
            <input id="logo-text" type="text" value="NOORDZUID" />
          </div>

          <div class="control">
            <label for="fall">Val</label>
            <input id="fall" type="checkbox" />
          </div>

          <div class="control">
            <span>Voorgrond</span>
            <div class="swatches" id="foreground-colors">
              <button class="swatch" data-color="#270C13" style="--color:#270C13" aria-label="Donkerpaars"></button>
              <button class="swatch active" data-color="#F28EFF" style="--color:#F28EFF" aria-label="Roze"></button>
              <button class="swatch" data-color="#353214" style="--color:#353214" aria-label="Donkergroen"></button>
              <button class="swatch" data-color="#FF8D8C" style="--color:#FF8D8C" aria-label="Zalm"></button>
              <button class="swatch" data-color="#DDAAFF" style="--color:#DDAAFF" aria-label="Lila"></button>
              <button class="swatch" data-color="#8BCAFF" style="--color:#8BCAFF" aria-label="Blauw"></button>
              <button class="swatch" data-color="#D4F2AA" style="--color:#D4F2AA" aria-label="Lime"></button>
              <button class="swatch" data-color="#053530" style="--color:#053530" aria-label="Donker zeeblauw"></button>
              <button class="swatch" data-color="#EBE8E4" style="--color:#EBE8E4" aria-label="Beige"></button>
            </div>
          </div>

          <div class="control">
            <span>Achtergrond</span>
            <div class="swatches" id="background-colors">
              <button class="swatch" data-color="#270C13" style="--color:#270C13" aria-label="Donkerpaars"></button>
              <button class="swatch active" data-color="#F28EFF" style="--color:#F28EFF" aria-label="Roze"></button>
              <button class="swatch" data-color="#353214" style="--color:#353214" aria-label="Donkergroen"></button>
              <button class="swatch" data-color="#FF8D8C" style="--color:#FF8D8C" aria-label="Zalm"></button>
              <button class="swatch" data-color="#DDAAFF" style="--color:#DDAAFF" aria-label="Lila"></button>
              <button class="swatch" data-color="#8BCAFF" style="--color:#8BCAFF" aria-label="Blauw"></button>
              <button class="swatch" data-color="#D4F2AA" style="--color:#D4F2AA" aria-label="Lime"></button>
              <button class="swatch" data-color="#053530" style="--color:#053530" aria-label="Donker zeeblauw"></button>
              <button class="swatch" data-color="#EBE8E4" style="--color:#EBE8E4" aria-label="Beige"></button>
            </div>
          </div>
        </section>

        <section class="section">
          <h2>Keyframes</h2>

          <div class="control">
              <label for="easing">Easing</label>
            <select id="easing">
              <optgroup label="Basis">
                <option value="linear">Linear</option>
                <option value="easeInQuad">Ease in quad</option>
                <option value="easeOutQuad">Ease out quad</option>
                <option value="easeInOutQuad">Ease in-out quad</option>
                <option value="easeInCubic" selected>Ease in cubic</option>
                <option value="easeOutCubic">Ease out cubic</option>
                <option value="easeInOutCubic">Ease in-out cubic</option>
                <option value="easeInQuart">Ease in quart</option>
                <option value="easeOutQuart">Ease out quart</option>
                <option value="easeInOutQuart">Ease in-out quart</option>
                <option value="easeInQuint">Ease in quint</option>
                <option value="easeOutQuint">Ease out quint</option>
                <option value="easeInOutQuint">Ease in-out quint</option>
              </optgroup>
              <optgroup label="Vloeiend">
                <option value="easeInSine">Ease in sine</option>
                <option value="easeOutSine">Ease out sine</option>
                <option value="easeInOutSine">Ease in-out sine</option>
                <option value="easeInExpo">Ease in expo</option>
                <option value="easeOutExpo">Ease out expo</option>
                <option value="easeInOutExpo">Ease in-out expo</option>
                <option value="easeInCirc">Ease in circ</option>
                <option value="easeOutCirc">Ease out circ</option>
                <option value="easeInOutCirc" selected>Ease in-out circ</option>
              </optgroup>
              <optgroup label="Funky">
                <option value="easeInBack">Back in</option>
                <option value="easeOutBack">Back out</option>
                <option value="easeInOutBack">Back in-out</option>
                <option value="easeInBounce">Bounce in</option>
                <option value="easeOutBounce">Bounce out</option>
                <option value="easeInOutBounce">Bounce in-out</option>
                <option value="easeInElastic">Elastic in</option>
                <option value="easeOutElastic">Elastic out</option>
                <option value="easeInOutElastic">Elastic in-out</option>
                <option value="steps4">Steps ×4</option>
                <option value="steps8">Steps ×8</option>
                <option value="wiggle">Wiggle</option>
              </optgroup>
            </select>
          </div>

          <div class="control">
            <label for="stagger">Stagger</label>
            <input id="stagger" type="range" min="0" max="1" value="0" step="0.1" />
          </div>

          <div class="control align-start">
            <label for="keyframe-list">Keyframes</label>
            <select id="keyframe-list" size="5"></select>
          </div>

          <div class="keyframe-buttons">
            <button id="add-keyframe">+</button>
            <button id="remove-keyframe">−</button>
          </div>

          <div class="control">
            <label for="duration">Lengte keyframe</label>
            <input id="duration" type="number" min="100" step="100" value="800" />
          </div>

          <div class="control">
            <label for="animation-duration">Lengte animatie</label>
            <input id="animation-duration" type="number" min="100" step="100" value="600" />
          </div>

          <div class="control">
            <span></span>
            <button id="play">Play</button>
          </div>
        </section>

        <section class="section">
          <h2>Export</h2>

          <div class="control">
            <label for="canvas-width">Breedte</label>
            <input id="canvas-width" type="number" min="200" max="1920" value="1000" />
          </div>

          <div class="control">
            <label for="canvas-height">Hoogte</label>
            <input id="canvas-height" type="number" min="200" max="1920" value="600" />
          </div>

          <div class="export-buttons">
            <button id="export-png">PNG</button>
            <button id="export-mp4">MP4</button>
          </div>

          <p id="status" aria-live="polite"></p>
        </section>
      </aside>

      <section class="stage">
        <div id="canvas-container"></div>
      </section>
    </main>

    <script src="sketch.js"></script>
  </body>
</html>
