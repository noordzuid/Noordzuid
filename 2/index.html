<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noordzuid animatie tool</title>
    <link rel="icon" type="image/x-icon" href="assets/N3.ico" />
    <link rel="stylesheet" href="../style.css" />
    <script src="../libraries/p5.min.js"></script>
  </head>

  <body>
    <main class="tool">
      <aside class="panel">
        <section class="section">
          <h1>Schets</h1>

          <div class="control">
            <label for="mode">Modus</label>
            <select id="mode">
              <option value="confetti" selected>Confetti</option>
              <option value="polonaise">Polonaise</option>
              <option value="streamers">Slingers</option>
              <option value="party">Party</option>
            </select>
          </div>

          <div id="confetti-controls" class="mode-settings">
            <div class="control">
              <label for="confetti-force">Force</label>
              <div class="range-with-value">
                <input id="confetti-force" type="range" min="0.25" max="2.5" value="2" step="0.05" />
                <output id="confetti-force-value" for="confetti-force">200%</output>
              </div>
            </div>
            <div class="control">
              <label for="random-stroke-colors">Random kleuren</label>
              <input id="random-stroke-colors" type="checkbox" />
            </div>
            <div class="control">
              <label for="debug-hitboxes">Debug hitboxes</label>
              <input id="debug-hitboxes" type="checkbox"/>
            </div>
          </div>

          <div id="polonaise-controls" class="mode-settings" hidden>
            <div id="direction" class="option-buttons" role="group" aria-label="Richting">
              <button data-value="left" aria-pressed="true">Links</button>
              <button data-value="right">Rechts</button>
              <button data-value="up">Omhoog</button>
              <button data-value="down">Omlaag</button>
            </div>
            <div id="polonaise-pattern" class="option-buttons" role="group" aria-label="Patroon">
              <button data-value="continuous" aria-pressed="true">Doorlopend</button>
              <button data-value="alternating">Om en om</button>
              <button data-value="blocks">Blokken</button>
            </div>
          </div>

          <div id="streamer-controls" class="mode-settings" hidden>
            <p>Klik een beginpunt en daarna een eindpunt.</p>
            <button id="clear-streamers">Wis slingers</button>
          </div>

          <div id="party-controls" class="mode-settings" hidden>
            <div class="control">
              <label for="party-motion">Snelheid</label>
              <div class="range-with-value">
                <input id="party-motion" type="range" min="0" max="100" value="50" step="1" />
                <output id="party-motion-value" for="party-motion">50%</output>
              </div>
            </div>
            <div class="control">
              <label for="party-frequency">Frequentie</label>
              <div class="range-with-value">
                <input id="party-frequency" type="range" min="0" max="100" value="35" step="1" />
                <output id="party-frequency-value" for="party-frequency">35%</output>
              </div>
            </div>
            <div class="control">
              <label for="party-variation">Variatie</label>
              <div class="range-with-value">
                <input id="party-variation" type="range" min="0" max="100" value="50" step="1" />
                <output id="party-variation-value" for="party-variation">50%</output>
              </div>
            </div>
            <div class="control">
              <label for="party-density">Vulling</label>
              <div class="range-with-value">
                <input id="party-density" type="range" min="0" max="100" value="50" step="1" />
                <output id="party-density-value" for="party-density">50%</output>
              </div>
            </div>
          </div>

          <div class="control">
            <label for="size">Grootte</label>
            <div class="range-with-value">
              <input id="size" type="range" min="24" max="500" value="72" step="2" />
              <output id="size-value" for="size">72 px</output>
            </div>
          </div>

          <div class="control">
            <label for="logo-variant">Stijl</label>
            <select id="logo-variant"></select>
          </div>

          <div id="vary-controls" class="mode-settings" hidden>
            <div class="control">
              <label for="vary-speed">Speed</label>
              <div class="range-with-value">
                <input id="vary-speed" type="range" min="0" max="100" value="50" step="1" />
                <output id="vary-speed-value" for="vary-speed">50%</output>
              </div>
            </div>
          </div>

          <div id="text-controls" class="mode-settings" hidden>
            <div class="control">
              <label for="logo-text">Tekst</label>
              <input id="logo-text" type="text" value="NOORDZUID" />
            </div>
          </div>

          <div class="control">
            <span id="foreground-label">Voorgrond</span>
            <div class="swatches" id="foreground-colors">
              <button class="swatch" data-color="#270C13" style="--color:#270C13" aria-label="Donkerpaars"></button>
              <button class="swatch" data-color="#F28EFF" style="--color:#F28EFF" aria-label="Roze"></button>
              <button class="swatch" data-color="#353214" style="--color:#353214" aria-label="Donkergroen"></button>
              <button class="swatch active" data-color="#FF8D8C" style="--color:#FF8D8C" aria-label="Zalm"></button>
              <button class="swatch" data-color="#DDAAFF" style="--color:#DDAAFF" aria-label="Lila"></button>
              <button class="swatch" data-color="#8BCAFF" style="--color:#8BCAFF" aria-label="Blauw"></button>
              <button class="swatch" data-color="#D4F2AA" style="--color:#D4F2AA" aria-label="Lime"></button>
              <button class="swatch" data-color="#053530" style="--color:#053530" aria-label="Donker zeeblauw"></button>
              <button class="swatch" data-color="#EBE8E4" style="--color:#EBE8E4" aria-label="Beige"></button>
            </div>
          </div>

          <div class="control">
            <span>Achtergrond</span>
            <div class="swatches" id="background-colors">
              <button class="swatch active" data-color="#270C13" style="--color:#270C13" aria-label="Donkerpaars"></button>
              <button class="swatch" data-color="#F28EFF" style="--color:#F28EFF" aria-label="Roze"></button>
              <button class="swatch" data-color="#353214" style="--color:#353214" aria-label="Donkergroen"></button>
              <button class="swatch" data-color="#FF8D8C" style="--color:#FF8D8C" aria-label="Zalm"></button>
              <button class="swatch" data-color="#DDAAFF" style="--color:#DDAAFF" aria-label="Lila"></button>
              <button class="swatch" data-color="#8BCAFF" style="--color:#8BCAFF" aria-label="Blauw"></button>
              <button class="swatch" data-color="#D4F2AA" style="--color:#D4F2AA" aria-label="Lime"></button>
              <button class="swatch" data-color="#053530" style="--color:#053530" aria-label="Donker zeeblauw"></button>
              <button class="swatch" data-color="#EBE8E4" style="--color:#EBE8E4" aria-label="Beige"></button>
            </div>
          </div>
        </section>

        <section class="section">
          <h2>Export</h2>

          <div class="control">
            <label for="export-duration">Lengte (sec)</label>
            <input id="export-duration" type="number" min="1" max="120" step="0.5" value="5" />
          </div>

          <div class="control">
            <label for="canvas-width">Breedte</label>
            <input id="canvas-width" type="number" min="200" max="6000" value="1080" />
          </div>

          <div class="control">
            <label for="canvas-height">Hoogte</label>
            <input id="canvas-height" type="number" min="200" max="6000" value="1920" />
          </div>

          <div class="export-buttons">
            <button id="export-png">PNG</button>
            <button id="export-mp4">MP4</button>
          </div>

          <p id="status" aria-live="polite"></p>
        </section>
      </aside>

      <section class="stage">
        <div id="canvas-container"></div>
      </section>
    </main>

    <script src="sketch.js"></script>
  </body>
</html>
