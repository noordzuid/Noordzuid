<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ebe8e4" />
    <meta name="description" content="Noordzuid animatietool voor merkbeelden en animaties." />
    <title>Noordzuid animatietool</title>
    <link rel="icon" href="assets/NZ.ico" sizes="32x32" />
    <link rel="stylesheet" href="style.css?v=20261008-1" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="panel" aria-label="Instellingen">
        <nav class="mode-switch" aria-label="Modus">
          <button class="mode-button is-active" type="button" data-mode="confetti">Confetti</button>
          <button class="mode-button" type="button" data-mode="polonaise">Polonaise</button>
          <button class="mode-button" type="button" data-mode="party">Party</button>
        </nav>

        <div class="panel-scroll">
          <section class="control-section mode-panel" data-panel="confetti">
            <div class="section-heading"><h2>Confetti</h2></div>
            <label class="field field-text"><span>Tekst</span><textarea id="confettiText" rows="2" maxlength="56" spellcheck="false">noordzuid</textarea></label>
            <label class="field"><span><span>Grootte</span><output id="confettiSizeOutput">0%</output></span><input id="confettiSize" type="range" min="0" max="100" step="1" value="0" /></label>
            <label class="field"><span><span>Kracht</span><output id="forceOutput">60%</output></span><input id="force" type="range" min="0" max="100" step="1" value="60" /></label>
          </section>

          <section class="control-section mode-panel" data-panel="polonaise" hidden>
            <div class="section-heading"><h2>Polonaise</h2></div>
            <label class="field"><span>Logo</span><select id="polonaiseLogo"></select></label>
            <div class="field">
              <span>Richting</span>
              <div class="direction-grid" id="directionGrid" role="group" aria-label="Richting">
                <button type="button" data-direction="up" aria-label="Naar boven">↑</button><button type="button" data-direction="left" aria-label="Naar links">←</button><button type="button" data-direction="down" aria-label="Naar onder">↓</button><button class="is-active" type="button" data-direction="right" aria-label="Naar rechts">→</button>
              </div>
            </div>
            <div class="field">
              <span>Beweging</span>
              <div class="segmented" id="alternatingControl" role="group" aria-label="Beweging"><button class="is-active" type="button" data-alternating="false">Één richting</button><button type="button" data-alternating="true">Om en om</button></div>
            </div>
            <label class="field"><span><span>Snelheid</span><output id="polonaiseSpeedOutput">100%</output></span><input id="polonaiseSpeed" type="range" min="25" max="200" step="1" value="100" /></label>
            <label class="field"><span><span>Lijnen</span><output id="polonaiseLineCountOutput">3</output></span><input id="polonaiseLineCount" type="range" min="1" max="5" step="1" value="3" /></label>
          </section>

          <section class="control-section mode-panel" data-panel="party" hidden>
            <div class="section-heading"><h2>Party</h2></div>
            <label class="field"><span>Logo</span><select id="partyLogo"></select></label>
            <label class="field"><span><span>Noise</span><output id="noiseOutput">58%</output></span><input id="noise" type="range" min="0" max="100" step="1" value="58" /></label>
            <label class="field"><span><span>Snelheid</span><output id="partySpeedOutput">100%</output></span><input id="partySpeed" type="range" min="10" max="100" step="1" value="100" /></label>
            <label class="field"><span><span>Logo’s</span><output id="partyCountOutput">18</output></span><input id="partyCount" type="range" min="4" max="48" step="1" value="18" /></label>
          </section>

          <section class="control-section appearance-section">
            <div class="toggle-row variation-toggle"><span>Variërende kleuren</span><label class="switch" aria-label="Variërende kleuren"><input id="varyColors" type="checkbox" checked /></label></div>
            <div class="palette-setting">
              <span>Voorgrond</span>
              <div class="palette" id="foregroundPalette" aria-label="Voorgrondkleuren"></div>
            </div>
            <div class="palette-setting">
              <span>Achtergrond</span>
              <div class="palette" id="backgroundPalette" aria-label="Achtergrondkleuren"></div>
            </div>
            <label class="field scale-field"><span><span>Schaal content</span><output id="contentScaleOutput">100%</output></span><input id="contentScale" type="range" min="35" max="180" step="1" value="100" /></label>
          </section>

          <section class="control-section export-section">
            <div class="section-heading"><h2>Export</h2></div>
            <div class="size-row">
              <label class="field"><span>Breedte</span><input id="canvasWidth" type="number" min="100" max="4096" step="1" value="1080" /></label>
              <button id="swapDimensions" class="swap-button size-swap" type="button" aria-label="Breedte en hoogte omwisselen">⇄</button>
              <label class="field"><span>Hoogte</span><input id="canvasHeight" type="number" min="100" max="4096" step="1" value="1920" /></label>
            </div>
            <div class="export-row">
              <label class="field"><span>Formaat</span><select id="exportFormat"><option value="mp4">MP4</option><option value="png">PNG</option></select></label>
              <label class="field duration-field"><span>Lengte</span><div class="input-suffix"><input id="exportDuration" type="number" min="1" max="30" step="1" value="6" /><span>sec</span></div></label>
            </div>
            <button class="export-button" id="exportButton" type="button"><span>Exporteer MP4</span></button>
            <div class="export-progress" id="exportProgress" hidden><span></span></div>
          </section>
        </div>
      </aside>

      <section class="workspace" aria-label="Canvas werkruimte">
        <div class="canvas-stage" id="canvasStage">
          <div class="canvas-controls" id="canvasControls" aria-live="polite">
            <span class="canvas-control" id="canvasControlPrimary"><kbd id="canvasControlButton">LMB</kbd><span id="canvasControlAction">Explosie</span></span>
            <span class="canvas-control" id="canvasControlSecondary"><kbd>RMB</kbd><span>Extra confetti</span></span>
          </div>
          <div class="canvas-frame" id="canvasFrame"><canvas id="artboard" width="1080" height="1920" aria-label="Voorvertoning"></canvas></div>
        </div>
      </section>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
